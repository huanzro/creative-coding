<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080e16"><title>Echoes of Light · 光的回响</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span class="brand-star">✧</span><span>ECHOES OF LIGHT<small>光 的 回 响</small></span></a><div class="edition"><span></span> INTERACTION STUDY <b>01</b></div><button id="fullscreen" class="quiet">全屏 ↗</button></header>

<main><section class="world" aria-label="中央小人与移动世界"><canvas id="world" aria-label="使用真实握拳张手、麦克风与点击交互"></canvas>
<div class="scene-label"><span id="scene-index"></span><h1 id="scene-title">回声庭院</h1><p id="scene-subtitle"></p></div><div class="scene-top"><span class="live-dot"></span><span id="activity">等待真实输入</span></div>
<div id="level-progress" class="level-progress"></div><div class="period-line"><span id="phase-label">薄暮</span><span id="journey-clock">00:00</span></div><div id="asset-status" role="status">正在展开世界…</div>
<div id="chapter-complete" class="chapter-card" hidden><h2 id="completion-title"></h2><p id="completion-score"></p><p id="completion-next"></p></div>
<div id="paused-overlay" aria-labelledby="pause-title" hidden><h2 id="pause-title">等待设备</h2><p id="pause-description" role="status"></p><button id="journey-start-action" class="primary" type="button" hidden></button></div>
<div class="journey-hud"><p id="encounter-status"></p><p id="journey-feedback" role="status" aria-live="polite"></p>
<div class="touch-choices" id="touch-choices" role="group" aria-label="两路触摸控制"><button type="button" data-touch-option="0" disabled>A · 暖光</button><button type="button" data-touch-option="1" disabled>B · 蓝光</button></div>
<div class="stage-bottom"><span>手势 <strong id="hand-state">等待</strong></span><span>声音 <strong id="voice-state">等待</strong></span><span><kbd>SPACE</kbd> 备用点击</span></div></div></section>
<aside><section class="control-section"><h3>01 <span>真实握拳与张手</span></h3><p class="level-help">开启摄像头后，先完整张开手掌，再尝试握拳。光圈会跟着你的手收拢与展开。</p><div class="camera-preview"><video id="webcam" autoplay playsinline muted></video><canvas id="hand-overlay" width="320" height="240"></canvas><span id="camera-placeholder">摄像头尚未开启</span></div><button id="camera-toggle" class="primary full">开启摄像头</button><button id="calibrate" class="quiet full" disabled>校准我的手势</button><div class="signal"><span id="signal-dot"></span><p id="signal-text" role="status">等待摄像头</p></div></section>
<section id="touch-game" class="control-section"></section>
<section class="session"><div><span class="eyebrow">ACCEPTED RESPONSES</span><p><strong id="count">00</strong><span>次回应</span></p></div><span id="response-flash">✧</span></section>
<details class="operator-controls"><summary>展台设置与章节</summary><div class="scene-buttons"><button data-scene="forest"><i class="forest-swatch"></i>森林与教程</button><button data-scene="geometry"><i class="geometry-swatch"></i>遗迹</button><button data-scene="stars"><i class="stars-swatch"></i>星海</button></div><button id="resume-journey" class="quiet full">继续上次旅程</button><button id="black-display" data-scene="black" class="quiet full">纯黑人物展示</button><label class="select-line">时段<select id="time-of-day"><option value="auto">自动</option><option value="dusk">薄暮</option><option value="blue">蓝调</option><option value="night">月夜</option><option value="dawn">破晓</option></select></label><button id="reset" class="quiet full">重试当前小段</button></details>
<button id="pause" class="quiet full">暂停旅程</button><button id="immersive" class="quiet full">隐藏面板 · 沉浸观看</button><p class="privacy">视频与麦克风声音仅在本机处理。<br>手离开镜头后旅程继续，回到镜头时先张手。</p></aside></main><footer><span>微光留在中央，世界因你而动。</span><span>握拳与张手 · 声音 · 点击</span><span>BODY DIALOGUE — V2</span></footer><script type="module" src="app.js"></script></body></html>
