<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光的回响 · 手势识别</title>
  <style id="camera-style">
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; color: #ebf4ef; background: #111b1a; }
    main { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { color: #becac4; line-height: 1.55; }
    .preview-frame { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #080e0d; border-radius: .7rem; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    .hand-guide { position: absolute; inset: 13% 24%; border: 2px dashed #e3fff09c; border-radius: .8rem; box-shadow: 0 0 0 1px #10231c9c; pointer-events: none; }
    .index-tip { position: absolute; width: .64rem; height: .64rem; border-radius: 50%; background: #e8fffd; transform: translate(-50%,-50%); box-shadow: 0 0 12px #8cf5ff; pointer-events: none; }
    .floating-preview { height: 100dvh; margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .floating-preview .preview-frame { aspect-ratio: auto; border-radius: 0; }
    .preview-status { margin: 0; padding: .55rem .7rem; font-size: .875rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .65rem; }
    button { color: #12221c; background: #b0e0c7; border: 0; border-radius: .4rem; padding: .65rem .95rem; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <h1>光的回响 · 手势识别</h1>
    <p>把手放入画面，保持本页打开。在星海只伸出食指指向镜头，亮点会跟随指尖。森林和遗迹可用握拳再张手起飞。</p>
    <div id="preview-frame" class="preview-frame">
      <video id="preview" autoplay muted playsinline></video>
      <span class="hand-guide" aria-hidden="true"></span>
      <span class="index-tip" hidden aria-hidden="true"></span>
    </div>
    <p id="status" role="status">正在准备摄像头…</p>
    <div class="actions">
      <button id="camera" type="button">开启摄像头</button>
      <button id="popout" type="button" disabled>打开独立预览</button>
    </div>
  </main>
  <script type="module" src="camera.mjs"></script>
</body>
</html>
